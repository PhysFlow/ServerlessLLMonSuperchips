[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memserve-control-plane"
version = "0.1.0"
description = "Request-level scheduling and coordination for MemServe"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["uvicorn>=0.30", "nvidia-ml-py>=12"]

[dependency-groups]
test = ["coverage>=7", "pytest>=8"]

[tool.setuptools]
packages = ["memserve_control_plane"]
package-dir = { "memserve_control_plane" = "." }
